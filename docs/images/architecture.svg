<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Consensus Room 시스템 구조</title><desc id="desc">React UI와 별도 Claude 중재 세션이 API를 호출합니다. 서버는 공통 실행, 계획, 전달 처리를 나누고 CLI 어댑터, SQLite 및 파일, Git worktree를 사용합니다.</desc>
